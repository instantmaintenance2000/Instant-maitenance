<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Instant Maintenance | Construction & Maintenance</title>

* {
    margin: 0;
    padding: 0;

}

html {

}

body {

/* HEADER */
header {
    background: #080808;

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-mark {
    width: 48px;
    height: 48px;
    background: #d4af37;
    color: #080808;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    border-radius: 6px;
}

.logo-text {
    font-size: 20px;
    font-weight: bold;
}

.logo-text span {
    color: #d4af37;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
    font-size: 14px;
}

nav a:hover {
    color: #d4af37;
}

/* HERO */
.hero {
    min-height: 620px;
    display: flex;
    align-items: center;
    position: relative;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.92) 0%,
            rgba(0,0,0,0.82) 35%,
            rgba(0,0,0,0.35) 70%,
            rgba(0,0,0,0.25) 100%
        ),
        url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=2000&q=85")
        center/cover no-repeat;
}

.hero-content {
    width: 90%;
    max-width: 1200px;
    margin: auto;
    color: white;
    padding: 80px 0;
}

.hero-content h1 {
    font-size: clamp(42px, 6vw, 72px);
    line-height: 1.05;
    max-width: 700px;
    margin-bottom: 20px;
}

.hero-content h1 span {
    color: #d4af37;
}

.hero-content p {
    font-size: 20px;
    max-width: 650px;
    margin-bottom: 30px;
    color: #eee;
}

.hero-buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    display: inline-block;
    padding: 14px 24px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 5px;
    transition: 0.3s;
}

.btn-gold {
    background: #d4af37;
    color: #080808;
}

.btn-gold:hover {
    background: #f0d15c;
    transform: translateY(-2px);
}

.btn-outline {
    border: 2px solid #d4af37;
    color: white;
}

.btn-outline:hover {
    background: #d4af37;
    color: #080808;
}

/* SECTION */
section {
    padding: 75px 6%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 38px;
    margin-bottom: 10px;
}

.section-title span {
    color: #d4af37;
}

.section-title p {
    color: #666;
}

/* SERVICES */
.services {
    background: #f6f6f6;
}

.service-grid {
    max-width: 1200px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
}

.service-card {
    background: white;
    padding: 30px;
    border-radius: 8px;
    border-top: 4px solid #d4af37;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.service-card:hover {
    transform: translateY(-6px);
}

.service-icon {
    font-size: 38px;
    margin-bottom: 15px;
}

.service-card h3 {
    margin-bottom: 10px;
    font-size: 21px;
}

.service-card p {
    color: #666;
}

/* ABOUT */
.about {
    max-width: 1100px;
    margin: auto;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 45px;
    align-items: center;
}

.about-image {
    min-height: 390px;
    border-radius: 10px;
    background:
        linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
        url("https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1200&q=85")
        center/cover no-repeat;
}

.about-text h2 {
    font-size: 38px;
    margin-bottom: 20px;
}

.about-text h2 span {
    color: #d4af37;
}

.about-text p {
    color: #555;
    margin-bottom: 15px;
}
